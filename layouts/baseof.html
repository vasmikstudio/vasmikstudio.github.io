<!doctype html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ site.Params.description }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  {{- with resources.Get "css/main.css" | minify }}
  <style>{{ .Content | safeCSS }}</style>
  {{- end }}
</head>
<body>
  <header>
    <a class="brand" href="{{ "/" | relURL }}">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="g-mark" x1="0" y1="0" x2="1" y2="1"><stop class="s1" offset="0"/><stop class="s2" offset=".6"/><stop class="s3" offset="1"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#g-mark)"/><path d="M8 9l8 15 8-15"/></svg>
      <span>{{ site.Title }}</span>
    </a>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    <p>&copy; {{ now.Year }} {{ site.Title }}</p>
  </footer>
</body>
</html>
